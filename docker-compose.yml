# 使い方
#   本番相当で起動:  docker compose up --build
#   開発サーバー:    docker compose --profile dev up
#
# 接続情報は .env から渡す（イメージには焼き込まない）。
# .env が無い場合は .env.example をコピーして値を埋める。

services:
  # 本番と同じSSRサーバー。Publish前の確認に使う。
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # ホットリロードつきの開発サーバー。--profile dev を付けたときだけ起動する。
  dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
      # ホスト側の node_modules（macOS向けバイナリ）で上書きされないようにする
      - /app/node_modules
    profiles:
      - dev
